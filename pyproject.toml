[project]
name = "expliccit-env"
version = "0.1.0"
description = "Real-kernel TCP experiment environment for expliCCit: labeled training data and Mahak-style performance maps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pyarrow>=18",
    "pydantic>=2.9",
]

[project.scripts]
expliccit = "expliccit_env.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.115",
    "pyarrow-stubs>=20.0.0.20260819",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expliccit_env"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "NPY"]
ignore = ["PLR0913", "PLR2004"]

[tool.pyright]
include = ["src"]
strict = ["src"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["uml: needs a built UML kernel and guest (EXPLICCIT_UML_DIR)"]
